name: secret-scan

# Scans only the commits a pull request (or push) adds. Full history is NOT scanned here because it still
# contains the known, already-reported backend/.env exposure (see SECURITY_HISTORY_REMEDIATION.md); a
# full-history scan would fail every run until that history is rewritten.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "::error::An .env file is tracked. Remove it and rotate any credential it contained."
            exit 1
          fi
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks (new commits only, findings redacted)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges ${{ steps.range.outputs.range }}"

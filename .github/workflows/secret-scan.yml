name: secret-scan

# Scans only the commits a pull request (or push) adds. Full history is NOT scanned here because it still
# contains the known, already-reported backend/.env exposure (see SECURITY_HISTORY_REMEDIATION.md); a
# full-history scan would fail every run until that history is rewritten.
# Every branch push is scanned, not only main: the repository is public, so a secret pushed to any branch
# (including automated branches that never open a PR) is published the moment it is pushed.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "::error::An .env file is tracked. Remove it and rotate any credential it contained."
            exit 1
          fi
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]                && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null                && git merge-base --is-ancestor "${{ github.event.before }}" "${{ github.sha }}"; then
            # Ordinary push: the commits it added.
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              # Skip commits already on main (merged in from main): they were scanned when main got them.
              echo "range=${{ github.event.before }}..${{ github.sha }} --not origin/main" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # New branch, or a force push: every commit on the branch that main does not already have
            # (previously only the tip commit was scanned, so a secret in an earlier commit was missed).
            echo "range=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Self-test - the scanner must catch each leaked credential type (generated fakes, throwaway repo)
        run: bash .github/scripts/secret-scan-selftest.sh zricethezav/gitleaks:v8.21.2
      - name: gitleaks (new commits only, findings redacted)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="--no-merges ${{ steps.range.outputs.range }}"

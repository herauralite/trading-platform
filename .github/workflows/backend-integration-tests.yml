name: backend-integration-tests

# Runs the backend suite against a throwaway PostgreSQL so the database-backed tests (FundingPips E2E,
# Match-Trader, account setup) actually execute instead of being skipped.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talitrade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - name: Start PgBouncer in transaction mode (what Neon's pooled endpoint runs)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer || true
          mkdir -p /tmp/pgb
          printf '"postgres" "postgres"\n' > /tmp/pgb/userlist.txt
          cat > /tmp/pgb/pgbouncer.ini <<'INI'
          [databases]
          talitrade_test = host=127.0.0.1 port=5432 dbname=talitrade_test user=postgres password=postgres pool_size=10
          talitrade_test_single = host=127.0.0.1 port=5432 dbname=talitrade_test user=postgres password=postgres pool_size=1
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          auth_type = trust
          auth_file = /tmp/pgb/userlist.txt
          pool_mode = transaction
          max_prepared_statements = 200
          ignore_startup_parameters = extra_float_digits,search_path
          logfile = /tmp/pgb/pgbouncer.log
          pidfile = /tmp/pgb/pgbouncer.pid
          INI
          pgbouncer --version
          pgbouncer -d /tmp/pgb/pgbouncer.ini
          for i in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 6433 -d talitrade_test && break; sleep 0.5; done
      - name: Run tests against PostgreSQL
        env:
          # CI-only throwaway values; the service container is destroyed after the job.
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test_db
          TALITRADE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talitrade_test
          TALITRADE_TEST_POOLER_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:6433/talitrade_test
          TALITRADE_TEST_POOLER_SINGLE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:6433/talitrade_test_single
          SECRET_KEY: ci-only-not-a-secret
        run: python -m pytest -q -p no:cacheprovider -rs
      - name: PgBouncer log (on failure)
        if: failure()
        working-directory: .
        run: cat /tmp/pgb/pgbouncer.log || true

# gitleaks configuration: the default rule set plus rules for the credential types this repository has
# actually leaked (see SECURITY_HISTORY_REMEDIATION.md). .github/scripts/secret-scan-selftest.sh proves on
# every run that each of those types is detected.
title = "TaliTrade gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "database-url-with-password"
description = "Database connection URL with an embedded password (e.g. a Neon DATABASE_URL)"
regex = '''(?i)\b(?:postgres(?:ql)?(?:\+asyncpg|\+psycopg2?)?|mysql(?:\+\w+)?|mongodb(?:\+srv)?|rediss?)://[^:@/\s'"]+:([^@/\s'"]{8,})@[^/\s'"]+'''
secretGroup = 1
# Excludes CI placeholders such as postgres:postgres@localhost; generated passwords are far above this.
entropy = 3.2
keywords = ["postgres", "mysql", "mongodb", "redis"]
